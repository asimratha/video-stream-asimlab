<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfect Video Stream</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* Container jo video ko 100% par fit karega */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Iframe jo YouTube ko proper scale karega */
        .video-container iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            /* Yeh ensure karta hai ki video landscape rahe aur 100% par fit ho */
            width: 100vw;
            height: calc(100vw / 1.7778); /* 16:9 Aspect Ratio calc */
            max-height: 100vh;
            max-width: calc(100vh * 1.7778); /* 16:9 Aspect Ratio calc */
            transform: translate(-50%, -50%);
            pointer-events: auto; /* Controls enable karne ke liye */
            border: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- YouTube embed parameters updated for modest branding -->
        <iframe 
            src="https://www.youtube.com/embed/GiL0zf5fPlk?autoplay=1&mute=0&controls=1&modestbranding=1&rel=0&loop=1&playlist=GiL0zf5fPlk" 
            title="Video Stream" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
